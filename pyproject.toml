[project]
name = "carbonbid"
version = "0.1.0"
description = "Carbon prices, strategic bidding and learning algorithms in a stylised electricity market"
authors = [{ name = "Saeed Samadiye" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
